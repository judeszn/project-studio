# Checks every push and pull request: a clean install, the full test suite,
# lint, the type check and production build, and the build scan for App Check
# debug tokens. It needs no secrets: without Firebase config the build runs on
# placeholders, which is enough to check the code. Actions are pinned to
# commits, not tags, so a moved tag cannot change what runs here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run scan:build
      # Fails only on a critical advisory in what ships to users. Development
      # tooling advisories are tracked separately (audit item M8).
      - run: npm audit --omit=dev --audit-level=critical
